<!-- @dsCard group="Forms" height=300 subtitle="A numbered question with its dropdowns" -->
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<div style="padding:24px">
  <div class="step" style="margin-top:0">
    <div class="step-number">2</div>
    <div class="step-body">
      <div class="step-title">Who do you want to look at?</div>
      <div class="fields">
        <div class="field">
          <label for="age">Age group</label>
          <select id="age" name="age">
            <option value="all">All ages</option>
            <option value="45-64">45 to 64</option>
            <option value="65-74" selected>65 to 74</option>
            <option value="75-plus">75 and over</option>
          </select>
        </div>
        <div class="field">
          <label for="condition">Long-term condition</label>
          <select id="condition" name="condition">
            <option value="all">All conditions</option>
            <option value="heart-disease" selected>Heart disease</option>
            <option value="diabetes">Diabetes</option>
            <option value="arthritis">Arthritis</option>
          </select>
        </div>
      </div>
    </div>
  </div>
</div>
